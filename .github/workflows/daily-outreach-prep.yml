name: Daily Outreach Prep
run-name: daily search

on:
  schedule:
    # 06:45 UTC = 06:45 Accra time (Ghana is UTC+0, no daylight saving)
    - cron: '45 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-seeker
  cancel-in-progress: false

jobs:
  daily-prep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Search -> scrape -> verify -> generate (never sends)
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python outreach_pipeline.py daily

      - name: Check inbox for replies
        continue-on-error: true
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
        run: python check_emails.py

      - name: Commit updated queue
        run: |
          git config user.name "YOUR NAME"
          git config user.email "your.email@gmail.com"
          # Row-level merge so dashboard approvals made during this run are never lost
          git config merge.queue.driver "python merge_queue.py %O %A %B"
          git config merge.keepours.driver true
          mkdir -p generated_letters
          git add outreach_queue.csv outreach_log.csv replies_log.csv generated_letters
          git diff --cached --quiet && exit 0
          git commit -m "Daily discovery run [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
